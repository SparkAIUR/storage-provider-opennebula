{{- if .Values.preflight.enabled }}
{{- $name := include "opennebula-csi.revisionName" (dict "root" . "component" "preflight") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ include "opennebula-csi.namespace" . }}
  {{- if .Values.preflight.failReleaseOnError }}
  annotations: {"helm.sh/hook": "pre-install,pre-upgrade", "helm.sh/hook-weight": "-20", "helm.sh/hook-delete-policy": "before-hook-creation"}
  {{- else }}
  annotations: {"helm.sh/resource-policy": "keep"}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  {{- if .Values.preflight.failReleaseOnError }}
  annotations: {"helm.sh/hook": "pre-install,pre-upgrade", "helm.sh/hook-weight": "-20", "helm.sh/hook-delete-policy": "before-hook-creation"}
  {{- else }}
  annotations: {"helm.sh/resource-policy": "keep"}
  {{- end }}
rules:
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csidrivers"]
    verbs: ["get", "list"]
{{- $secretNames := list -}}
{{- range concat (.Values.preflight.nodeStageSecretRefs | default list) (.Values.preflight.provisionerSecretRefs | default list) -}}
{{- $secretNames = append $secretNames .name -}}
{{- end -}}
{{- if $secretNames }}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: {{ uniq $secretNames | toJson }}
    verbs: ["get"]
{{- end }}
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  {{- if .Values.preflight.failReleaseOnError }}
  annotations: {"helm.sh/hook": "pre-install,pre-upgrade", "helm.sh/hook-weight": "-10", "helm.sh/hook-delete-policy": "before-hook-creation"}
  {{- else }}
  annotations: {"helm.sh/resource-policy": "keep"}
  {{- end }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $name }}}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ include "opennebula-csi.namespace" . }}
{{- end }}
