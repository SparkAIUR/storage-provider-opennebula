---
name: Promote qualified CSI image
on:
  workflow_dispatch:
    inputs:
      qualification_run:
        description: Successful protected native-qualification workflow run ID at this exact RC source commit
        required: true
      stable_tag:
        description: Stable tag (for example v0.6.0); binary keeps its qualified RC VendorVersion
        required: true
concurrency:
  group: csi-stable-${{ inputs.stable_tag }}
  cancel-in-progress: false
permissions: {contents: write, packages: write, actions: read}
jobs:
  promote:
    environment: csi-stable-promotion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require configured protected publication environment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/csi-stable-promotion" > environment.json
          python3 - <<'PYCODE'
          import json
          rules=json.load(open('environment.json'))['protection_rules']
          assert any(r['type']=='required_reviewers' and r.get('reviewers') for r in rules), 'Configure required reviewers before publication/qualification'
          PYCODE
      - name: Download trusted qualification artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.qualification_run }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run.json
          python3 - <<'PY'
          import json,os
          run=json.load(open('run.json'))
          assert run['path']=='.github/workflows/native-qualification.yaml'
          assert run['head_sha']==os.environ['GITHUB_SHA'] and run['conclusion']=='success'
          assert run['event']=='workflow_dispatch'
          PY
          gh run download "$RUN_ID" --name native-qualification --dir qualification
          python3 hack/upgrade_evidence.py qualify --stable --candidate qualification/candidate.json --evidence qualification/native.json
      - uses: azure/setup-helm@v4
        with:
          version: v3.21.4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.8"
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verify exact source and promote image without rebuilding
        env:
          STABLE_TAG: ${{ inputs.stable_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$STABLE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(python3 -c 'import json;print(json.load(open("qualification/candidate.json"))["sourceCommit"])')" = "$GITHUB_SHA"
          test "$(python3 -c 'import json;print(json.load(open("qualification/candidate.json"))["sourceTree"])')" = "$(git rev-parse HEAD^{tree})"
          if git ls-remote --exit-code --refs origin "refs/tags/$STABLE_TAG" > stable-tag.ref; then
            git fetch --no-tags origin "refs/tags/$STABLE_TAG"
            test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
          else
            tag_status=$?
            test "$tag_status" -eq 2
          fi
          uv run --no-project --with PyYAML==6.0.3 python hack/promote_chart.py --candidate qualification/candidate.json --receipt qualification/native.json --version "${STABLE_TAG#v}" --output _stable
          python3 hack/guard_candidate_publication.py --stable --tag "$STABLE_TAG"
          IMAGE="$(python3 -c 'import json;print(json.load(open("qualification/candidate.json"))["images"]["opennebula-csi"])')"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --prefer-index=false --tag "ghcr.io/sparkaiur/opennebula-csi:$STABLE_TAG" --tag "nudevco/opennebula-csi:$STABLE_TAG" "$IMAGE"
          test "$(docker buildx imagetools inspect "ghcr.io/sparkaiur/opennebula-csi:$STABLE_TAG" --format '{{.Manifest.Digest}}')" = "${IMAGE##*@}"
          test "$(docker buildx imagetools inspect "nudevco/opennebula-csi:$STABLE_TAG" --format '{{.Manifest.Digest}}')" = "${IMAGE##*@}"
          gh release create "$STABLE_TAG" --target "$GITHUB_SHA" --title "$STABLE_TAG" --notes 'Promoted qualified image without rebuilding; binary VendorVersion retains the qualified RC identity. Stable chart rendering was compared with the frozen candidate; only chart metadata differs.' qualification/candidate.json qualification/native.json _stable/*.tgz
      - name: Checkout isolated qualified stable chart channel
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _qualified-pages
      - name: Publish qualified stable index without advancing other consumers
        env:
          STABLE_TAG: ${{ inputs.stable_tag }}
        run: |
          mkdir -p _qualified-pages/charts/qualified
          cp _stable/*.tgz _qualified-pages/charts/qualified/
          cd _qualified-pages/charts/qualified
          if test -f index.yaml; then
            helm repo index . --merge index.yaml --url https://sparkaiur.github.io/storage-provider-opennebula/charts/qualified/
          else
            helm repo index . --url https://sparkaiur.github.io/storage-provider-opennebula/charts/qualified/
          fi
          git add .
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git commit -m "Qualified stable chart $STABLE_TAG"
          git push
