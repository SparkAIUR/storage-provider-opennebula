---
name: Release candidate
on:
  push:
    tags: ['v*.*.*-rc.*']
concurrency:
  group: csi-candidate-${{ github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: write
  packages: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: azure/setup-helm@v4
        with:
          version: v3.21.4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.8"
      - run: |
          go test -count=1 ./...
          go vet ./...
          go test -race ./pkg/csi/driver ./pkg/csi/opennebula ./pkg/inventory/...
          uv run --no-project --with PyYAML==6.0.3 python -m unittest discover -s hack -p 'test_*.py'
          helm lint helm/opennebula-csi
          bash hack/validate-chart-version-alignment.sh "$GITHUB_REF_NAME"
          bash hack/validate-storageclass-reconcile-render.sh
  candidate:
    needs: verify
    environment: csi-candidate-publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require configured protected publication environment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/csi-candidate-publication" > environment.json
          python3 - <<'PYCODE'
          import json
          rules=json.load(open('environment.json'))['protection_rules']
          assert any(r['type']=='required_reviewers' and r.get('reviewers') for r in rules), 'Configure required reviewers before publication/qualification'
          PYCODE
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Refuse replacement of an existing candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 hack/guard_candidate_publication.py --tag "$GITHUB_REF_NAME"
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sparkaiur/opennebula-csi:${{ github.ref_name }}
            nudevco/opennebula-csi:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
      - uses: azure/setup-helm@v4
        with:
          version: v3.21.4
      - name: Package candidate; never promote stable here
        env:
          IMAGE: ghcr.io/sparkaiur/opennebula-csi@${{ steps.image.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _candidate
          printf '%s\n' "$IMAGE" > _candidate/image.txt
          git rev-parse HEAD > _candidate/source-commit.txt
          git rev-parse HEAD^{tree} > _candidate/source-tree.txt
          helm package helm/opennebula-csi --destination _candidate
          sha256sum _candidate/* > _candidate/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --prerelease --title "$GITHUB_REF_NAME" --notes 'Candidate artifacts only. Native qualification and stable promotion remain gated.' _candidate/*
      - name: Checkout isolated candidate chart channel
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _candidate-pages
      - name: Publish only the candidate chart index
        env:
          RC_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p _candidate-pages/charts/candidates
          cp _candidate/*.tgz _candidate-pages/charts/candidates/
          cd _candidate-pages/charts/candidates
          if test -f index.yaml; then
            helm repo index . --merge index.yaml --url https://sparkaiur.github.io/storage-provider-opennebula/charts/candidates/
          else
            helm repo index . --url https://sparkaiur.github.io/storage-provider-opennebula/charts/candidates/
          fi
          git add .
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git commit -m "Candidate chart $RC_TAG"
          git push
