---
name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - v0.5.x

permissions:
  contents: read

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.8"

      - name: Validate chart/image version alignment
        run: bash hack/validate-chart-version-alignment.sh

      - name: Run Go tests
        run: go test -count=1 ./...

      - name: Verify Go safety checks
        run: |
          go vet ./...
          go test -race ./pkg/csi/driver ./pkg/csi/opennebula ./pkg/inventory/...
          RUN_CSI_SANITY_TESTS=1 go test ./pkg/csi/driver -run '^TestFixtureCSISanity$' -count=1 -v

      - name: Verify release evidence tooling
        run: uv run --no-project --with PyYAML==6.0.3 python -m unittest discover -s hack -p 'test_*.py'

      - name: Lint chart
        run: helm lint helm/opennebula-csi

      - name: Render chart with inline credentials
        run: helm template opennebula-csi helm/opennebula-csi --values examples/helm-values-multi-datastore.yaml

      - name: Render chart with existing secret
        run: helm template opennebula-csi helm/opennebula-csi --values examples/helm-values-existing-secret.yaml

      - name: Render chart with Ceph example
        run: helm template opennebula-csi helm/opennebula-csi --values examples/helm-values-ceph-ceph-mode.yaml

      - name: Render chart with CephFS static example
        run: helm template opennebula-csi helm/opennebula-csi --values examples/helm-values-cephfs-static.yaml

      - name: Render chart with CephFS dynamic example
        run: helm template opennebula-csi helm/opennebula-csi --values examples/helm-values-cephfs-dynamic.yaml

      - name: Validate StorageClass reconcile render guard
        run: bash hack/validate-storageclass-reconcile-render.sh
